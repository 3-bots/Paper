name: VillagerInstantJob
version: '1.1.5'
main: com.villagerinstantjob.plugin.VillagerInstantJobPlugin
api-version: '1.20'
author: VillagerInstantJob
description: Unemployed villagers claim a newly placed workstation instantly instead of after vanilla's usual delay.

commands:
  villagerinstantjob:
    description: Manage the VillagerInstantJob plugin
    usage: /<command> <reload|scan>
    aliases: [vjob]

permissions:
  villagerinstantjob.reload:
    description: Allows reloading the VillagerInstantJob configuration
    default: op
