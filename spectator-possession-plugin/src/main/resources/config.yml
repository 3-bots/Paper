settings:
  # Whether a possessed creeper's explosion (triggered by pressing its ability
  # key) breaks blocks. The explosion always damages/knocks back nearby
  # entities either way.
  creeper-explosion-breaks-blocks: false

messages:
  prefix: '&7[&5Possession&7]'
  possess_denied_taken: '&cSomeone else is already possessing that mob.'
  possess_released: '&fYou have released the mob.'
  possess_ended_death: '&cThe mob you were possessing died. You have been released.'
  possess_started: '&dYou are now possessing this creature. &7(v%s)'
