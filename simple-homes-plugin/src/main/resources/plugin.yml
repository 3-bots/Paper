name: SimpleHomes
version: '1.2.5'
main: com.simplehomes.plugin.SimpleHomesPlugin
api-version: '1.20'
author: SimpleHomes
description: Multi-home plugin where the first home is free and additional homes cost resources.

commands:
  sethome:
    description: Set a home at your current location
    usage: /<command> [name]
  delhome:
    description: Delete one of your homes
    usage: /<command> [name]
  home:
    description: Teleport to one of your homes
    usage: /<command> [name]
  homes:
    description: List your homes
    usage: /<command>
    aliases: [myhomes]
  simplehomes:
    description: SimpleHomes admin command
    usage: /<command> reload
    aliases: [shomes]
  tpa:
    description: Request to teleport to another player
    usage: /<command> <player>
  tpahere:
    description: Request that another player teleport to you
    usage: /<command> <player>
  tpaccept:
    description: Accept a pending teleport request
    usage: /<command>
    aliases: [tpyes]
  tpdeny:
    description: Deny a pending teleport request
    usage: /<command>
    aliases: [tpno]

permissions:
  simplehomes.sethome:
    description: Allows setting homes
    default: true
  simplehomes.delhome:
    description: Allows deleting homes
    default: true
  simplehomes.home:
    description: Allows teleporting to homes
    default: true
  simplehomes.homes:
    description: Allows listing homes
    default: true
  simplehomes.reload:
    description: Allows reloading the SimpleHomes configuration
    default: op
  simplehomes.bypasscost:
    description: Allows setting homes without paying the resource cost
    default: op
  simplehomes.tpa:
    description: Allows sending, accepting, and denying teleport requests
    default: true
