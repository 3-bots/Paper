name: SimpleHomes
version: '1.1.1'
main: com.simplehomes.plugin.SimpleHomesPlugin
api-version: '1.20'
author: SimpleHomes
description: Multi-home plugin where the first home is free and additional homes cost resources.

commands:
  sethome:
    description: Set a home at your current location
    usage: /<command> [name]
  delhome:
    description: Delete one of your homes
    usage: /<command> [name]
  home:
    description: Teleport to one of your homes
    usage: /<command> [name]
  homes:
    description: List your homes
    usage: /<command>
    aliases: [myhomes]
  simplehomes:
    description: SimpleHomes admin command
    usage: /<command> reload
    aliases: [shomes]

permissions:
  simplehomes.sethome:
    description: Allows setting homes
    default: true
  simplehomes.delhome:
    description: Allows deleting homes
    default: true
  simplehomes.home:
    description: Allows teleporting to homes
    default: true
  simplehomes.homes:
    description: Allows listing homes
    default: true
  simplehomes.reload:
    description: Allows reloading the SimpleHomes configuration
    default: op
  simplehomes.bypasscost:
    description: Allows setting homes without paying the resource cost
    default: op
