name: Build HorseInspector Plugin

on:
  push:
    paths:
      - 'horse-inspector-plugin/**'
      - '.github/workflows/horse-inspector-plugin.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horse-inspector-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: HorseInspector
          path: horse-inspector-plugin/build/libs/HorseInspector-*.jar
