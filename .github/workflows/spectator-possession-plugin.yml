name: Build SpectatorPossession Plugin

on:
  push:
    paths:
      - 'spectator-possession-plugin/**'
      - 'spectator-possession-plugin.settings.gradle.kts'
      - 'settings.gradle.kts'
      - 'paper-api/**'
      - '.github/workflows/spectator-possession-plugin.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Build
        run: ./gradlew :spectator-possession-plugin:build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: SpectatorPossession
          path: spectator-possession-plugin/build/libs/SpectatorPossession-*.jar
