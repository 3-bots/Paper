name: Build StealthBeacon Plugin

on:
  push:
    paths:
      - 'stealthbeacon-plugin/**'
      - 'stealthbeacon-plugin.settings.gradle.kts'
      - 'settings.gradle.kts'
      - 'paper-api/**'
      - '.github/workflows/stealthbeacon-plugin.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Build
        run: ./gradlew :stealthbeacon-plugin:build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: StealthBeacon
          path: stealthbeacon-plugin/build/libs/StealthBeacon-*.jar
