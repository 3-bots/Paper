name: Build LeashTeleport Plugin

on:
  push:
    paths:
      - 'leash-teleport-plugin/**'
      - '.github/workflows/leash-teleport-plugin.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leash-teleport-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: LeashTeleport
          path: leash-teleport-plugin/build/libs/LeashTeleport-*.jar
