name: Build HardcoreRevival Plugin

on:
  push:
    paths:
      - 'hardcore-revival-plugin/**'
      - 'hardcore-revival-plugin.settings.gradle.kts'
      - 'settings.gradle.kts'
      - 'paper-api/**'
      - '.github/workflows/hardcore-revival-plugin.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Build
        run: ./gradlew :hardcore-revival-plugin:build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: HardcoreRevival
          path: hardcore-revival-plugin/build/libs/HardcoreRevival-*.jar
