name: Build ItemDurabilityDisplay Plugin

on:
  push:
    paths:
      - 'item-durability-display-plugin/**'
      - 'item-durability-display-plugin.settings.gradle.kts'
      - 'settings.gradle.kts'
      - 'paper-api/**'
      - '.github/workflows/item-durability-display-plugin.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Build
        run: ./gradlew :item-durability-display-plugin:build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ItemDurabilityDisplay
          path: item-durability-display-plugin/build/libs/ItemDurabilityDisplay-*.jar
