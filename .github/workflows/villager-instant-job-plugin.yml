name: Build VillagerInstantJob Plugin

on:
  push:
    paths:
      - 'villager-instant-job-plugin/**'
      - '.github/workflows/villager-instant-job-plugin.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: villager-instant-job-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: VillagerInstantJob
          path: villager-instant-job-plugin/build/libs/VillagerInstantJob-*.jar
