name: Build SugarCaneBonemeal Plugin

on:
  push:
    paths:
      - 'sugarcane-bonemeal-plugin/**'
      - '.github/workflows/sugarcane-bonemeal-plugin.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugarcane-bonemeal-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: SugarCaneBonemeal
          path: sugarcane-bonemeal-plugin/build/libs/SugarCaneBonemeal-*.jar
