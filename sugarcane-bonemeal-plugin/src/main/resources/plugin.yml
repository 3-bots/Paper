name: SugarCaneBonemeal
version: '1.0.0'
main: com.sugarcanebonemeal.plugin.SugarCaneBonemealPlugin
api-version: '1.20'
author: SugarCaneBonemeal
description: Lets dispensers grow sugar cane by dispensing bone meal onto it, which vanilla doesn't support.

commands:
  sugarcanebonemeal:
    description: Manage the SugarCaneBonemeal plugin
    usage: /<command> reload
    aliases: [scbm]

permissions:
  sugarcanebonemeal.reload:
    description: Allows reloading the SugarCaneBonemeal configuration
    default: op
