name: VillagerWorkstation
version: '1.0.0'
main: com.villagerworkstation.plugin.VillagerWorkstationPlugin
api-version: '1.20'
author: VillagerWorkstation
description: Snaps villagers back to within a block of their claimed workstation during the day.

commands:
  villagerworkstation:
    description: Manage the VillagerWorkstation plugin
    usage: /<command> reload
    aliases: [vwork]

permissions:
  villagerworkstation.reload:
    description: Allows reloading the VillagerWorkstation configuration
    default: op
